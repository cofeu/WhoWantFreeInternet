# WWFI dnsmasq configuration (used by docker dnsmasq service and install.sh).
port=53
no-resolv
no-hosts
cache-size=1000

# Local WWFI domain mappings
address=/demo.local/127.0.0.1
address=/shop.local/127.0.0.1

# Upstream resolver (dnsmasq will forward everything else here)
server=8.8.8.8
server=1.1.1.1