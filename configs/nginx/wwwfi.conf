# WWFI nginx reverse proxy (SNI, single IP, many domains)
# Generated example. Place per-domain files in sites-available/ and symlink
# into sites-enabled/ (or run scripts/generate_reverse_proxy.sh).

# demo.local -> wwfi demo backend on 8000
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.local;

    ssl_certificate     /etc/nginx/certs/demo.local.crt;
    ssl_certificate_key /etc/nginx/certs/demo.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://wwfi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

